services:
  - type: web
    name: financial-intelligence-os
    runtime: python
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
    buildCommand: pip install --upgrade pip wheel setuptools && pip install --prefer-binary -r requirements.txt
    startCommand: uvicorn apps.main:app --host 0.0.0.0 --port $PORT
