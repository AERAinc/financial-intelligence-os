<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Intelligence OS</title>
    <style>
        :root {
            --bg-base: #090d16;
            --bg-card: #111827;
            --border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-weight: 700; font-size: 20px; color: var(--accent); letter-spacing: -0.025em; }
        .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 24px; font-size: 14px; font-weight: 500; }
        .nav-links a:hover { color: var(--accent); }
        .container { max-width: 800px; margin: 50px auto; padding: 0 20px; width: 100%; flex: 1; }
        .dashboard-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 40px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
        h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.025em; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 32px; line-height: 1.5; }
        .input-group { margin-bottom: 24px; }
        label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; color: var(--text-muted); }
        .dropzone { border: 2px dashed var(--border); background: rgba(17, 24, 39, 0.6); padding: 28px; border-radius: 12px; text-align: center; cursor: pointer; transition: all 0.2s ease; }
        .dropzone:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.04); }
        .dropzone p { color: var(--text-muted); font-size: 14px; }
        .dropzone span { color: var(--accent); font-weight: 600; }
        textarea { width: 100%; background: #0b0f19; border: 1px solid var(--border); border-radius: 12px; padding: 16px; color: var(--text-main); font-size: 14px; line-height: 1.5; resize: vertical; min-height: 120px; outline: none; transition: border-color 0.2s; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
        .btn-primary { background: var(--accent); color: #090d16; border: none; border-radius: 12px; padding: 14px 28px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-primary:hover { background: var(--accent-hover); }
        .output-box { margin-top: 28px; background: #0b0f19; border: 1px solid var(--border); border-radius: 12px; padding: 20px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; display: none; color: #e2e8f0; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>
    <header>
        <div class="brand">Financial Intelligence OS</div>
        <div class="nav-links">
            <a href="/docs" target="_blank">API Docs</a>
            <a href="/routes" target="_blank">Routes</a>
        </div>
    </header>
    <div class="container">
        <div class="dashboard-card">
            <h1>Quantitative Accounting Engine</h1>
            <p class="subtitle">Upload financial data sheets or provide diagnostic prompts to run automated valuation, multi-variable credit indexing, and ledger audits.</p>
            <div class="input-group">
                <label>Dataset Source (CSV / Excel)</label>
                <div class="dropzone" onclick="document.getElementById('fileUpload').click()">
                    <input type="file" id="fileUpload" accept=".csv, .xlsx, .xls" style="display: none;" onchange="trackFile(event)">
                    <p id="fileLabel">Drop your spreadsheet here or <span>Browse Files</span></p>
                </div>
            </div>
            <div class="input-group">
                <label>Audit Instructions / Analysis Prompt</label>
                <textarea id="promptInput" placeholder="e.g., Audit this trial balance for liquidity stress, compute asset turnover ratios, and summarize variance..."></textarea>
            </div>
            <button class="btn-primary" onclick="executeEngine()">Execute Financial Pipeline</button>
            <div id="outputContainer" class="output-box"></div>
        </div>
    </div>
<script>
let datasetPayload = "";
function trackFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    document.getElementById('fileLabel').innerHTML = `Loaded Dataset: <strong style="color: var(--accent);">${file.name}</strong>`;
    const reader = new FileReader();
    reader.onload = function(evt) { datasetPayload = evt.target.result; };
    reader.readAsText(file);
}
async function executeEngine() {
    const queryText = document.getElementById('promptInput').value.trim();
    const box = document.getElementById('outputContainer');
    if (!queryText && !datasetPayload) { alert("Please include prompt instructions or upload a financial dataset."); return; }
    box.style.display = 'block';
    box.textContent = 'Executing financial pipelines, verifying ledger constraints, and generating analysis...';
    try {
        const res = await fetch('/api/v1/ai-copilot', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: queryText || "Perform financial audit.", context: { engine: "accounting", data: datasetPayload } })
        });
        const data = await res.json();
        box.textContent = data.answer || JSON.stringify(data, null, 2);
    } catch (err) {
        box.textContent = 'Connection error: Failed to communicate with backend service.';
    }
}
</script>
</body>
</html>
