services:
  postgres:
    image: postgres:16-alpine
    container_name: fios-postgres
    environment:
      POSTGRES_USER: fios
      POSTGRES_PASSWORD: fios_dev_password
      POSTGRES_DB: financial_intelligence_os
    ports:
      - "5432:5432"
    volumes:
      - fios_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fios -d financial_intelligence_os"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fios_pgdata: